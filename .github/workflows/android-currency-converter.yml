name: Android Currency Converter

# Builds the debug APK for the Android currency-converter app and uploads it
# as a downloadable artifact. The runner already has the Android SDK, so no
# extra setup is required.
on:
  push:
    branches:
      - "**"
    paths:
      - "android-currency-converter/**"
      - ".github/workflows/android-currency-converter.yml"
  pull_request:
    paths:
      - "android-currency-converter/**"
      - ".github/workflows/android-currency-converter.yml"
  # Lets you trigger a build manually from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-currency-converter

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: currency-converter-debug-apk
          path: android-currency-converter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
